<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<title>Adventskalender</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ===== Kopf ===== -->
<header id="topbar">
  <div class="brand" id="brandHome">🎄 <span>Adventskalender</span></div>
  <div class="top-actions" id="topActions"></div>
</header>

<main id="app">
  <!-- Ansichten werden von app.js in #view gerendert -->
  <div id="view"></div>
</main>

<!-- ===== Modal (Tagesansicht / Dialoge) ===== -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Schließen">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Drehen-Hinweis (nur Nutzer-Ansicht, Handy im Hochformat) -->
<div id="rotateHint" aria-hidden="true">
  <div class="rotate-ico">📱</div>
  <p class="rotate-title">Bitte dreh dein Gerät</p>
  <p class="rotate-sub">Der Adventskalender wird im Querformat angezeigt. 🎄</p>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- ===== Firebase (compat SDK) ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/crypto.js"></script>
<script src="js/snow.js"></script>
<script src="js/fly.js"></script>
<script src="js/app.js"></script>
</body>
</html>
